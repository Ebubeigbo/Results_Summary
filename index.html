<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <section id="main">
    <!-- Blue section -->
    <div class="blue">    
      <p>Your Result</p>
      <p class="score"><span>76</span>of 100</p>
      <p class="yarn"><span>Great</span>You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <!-- Blue section ends -->

    <!-- Summary starts -->
    <div class="summary">
      <span class="head">Summary</span>
      <section class="rate">
        <div class="rates one">
          <img src="./assets/images/icon-reaction.svg" alt="">
          <span>Reaction</span>
          <span class="num"><span>80</span> / 100</span>
        </div>
        <div class="rates two">
          <img src="./assets/images/icon-memory.svg" alt="">
          <span>Memory</span>
          <span class="num"><span>92</span> / 100</span>
        </div>
        <div class="rates three">
          <img src="./assets/images/icon-verbal.svg" alt="">
          <span>Verbal</span>
          <span class="num"><span>61</span> / 100</span>
        </div>
        <div class="rates four">
          <img src="./assets/images/icon-visual.svg" alt="">
          <span>Visual</span>
          <span class="num"><span>73</span> / 100</span>
        </div>
      </section>
      <a href="#"><button class="button">Continue</button></a>
    </div>
    <!-- Summary ends -->
  </section>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Igbo Donald Ebubechukwu</a>.
  </footer>
</body>
</html>
